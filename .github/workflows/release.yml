name: Release

# Triggered when a version tag is pushed (e.g. v1.0.0, v1.2.3-rc1).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux — desativado temporariamente (em teste) ──────────────────
          # - os: ubuntu-latest
          #   artifact_name: pmas-linux-x64
          #   artifact_path: dist/pmas-linux-x64

          - os: windows-latest
            artifact_name: pmas-windows-x64.exe
            artifact_path: dist/pmas-windows-x64.exe

          # ── macOS — desativado temporariamente (em teste) ──────────────────
          # - os: macos-latest
          #   artifact_name: pmas-macos-arm64
          #   artifact_path: dist/pmas-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt pyinstaller

      # ── Linux ──────────────────────────────────────────────────────────────

      - name: Build standalone executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller \
            --onefile \
            --strip \
            --name pmas-linux-x64 \
            --add-data "frontend:frontend" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import fastapi \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import multipart \
            --hidden-import anyio \
            --hidden-import h11 \
            --hidden-import slowapi \
            --hidden-import limits \
            --collect-all openpyxl \
            run.py

      # ── Windows ────────────────────────────────────────────────────────────

      - name: Build standalone executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller `
            --onefile `
            --name pmas-windows-x64 `
            --icon assets\icon.ico `
            --add-data "frontend;frontend" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import fastapi `
            --hidden-import sqlalchemy.dialects.sqlite `
            --hidden-import multipart `
            --hidden-import anyio `
            --hidden-import h11 `
            --hidden-import slowapi `
            --hidden-import limits `
            --collect-all openpyxl `
            run.py

      # ── macOS ──────────────────────────────────────────────────────────────

      - name: Build standalone executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller \
            --onefile \
            --name pmas-macos-arm64 \
            --add-data "frontend:frontend" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import fastapi \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import multipart \
            --hidden-import anyio \
            --hidden-import h11 \
            --hidden-import slowapi \
            --hidden-import limits \
            --collect-all openpyxl \
            run.py

      # ── Upload ─────────────────────────────────────────────────────────────

      - name: Upload executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
