name: Release

# Triggered when a version tag is pushed (e.g. v1.0.0, v1.2.3-rc1).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - os: ubuntu-latest
            artifact_name: pmas-linux-x64
            artifact_path: dist/pmas-linux-x64

          - os: windows-latest
            artifact_name: pmas-windows-x64.exe
            artifact_path: dist/pmas-windows-x64.exe

          # ── macOS — desativado temporariamente (em teste) ──────────────────
          # - os: macos-latest
          #   artifact_name: pmas-macos-arm64
          #   artifact_path: dist/pmas-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt pyinstaller

      # ── Linux ──────────────────────────────────────────────────────────────

      - name: Build standalone executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller \
            --onefile \
            --strip \
            --name pmas-linux-x64 \
            --add-data "frontend:frontend" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import fastapi \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import multipart \
            --hidden-import anyio \
            --hidden-import h11 \
            --hidden-import slowapi \
            --hidden-import limits \
            --collect-all openpyxl \
            run.py

      - name: Smoke test the Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          PMAS_DB_PATH="$RUNNER_TEMP/smoke.db" PMAS_PORT=8765 ./dist/pmas-linux-x64 &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/ready
          curl -sf -o /dev/null http://127.0.0.1:8765/frontend/index.html
          kill $pid

      - name: Build the Linux install package
        if: matrix.os == 'ubuntu-latest'
        run: packaging/build_package.sh dist/pmas-linux-x64 dist

      # ── Windows ────────────────────────────────────────────────────────────

      - name: Build standalone executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller `
            --onefile `
            --name pmas-windows-x64 `
            --icon assets\icon.ico `
            --add-data "frontend;frontend" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import fastapi `
            --hidden-import sqlalchemy.dialects.sqlite `
            --hidden-import multipart `
            --hidden-import anyio `
            --hidden-import h11 `
            --hidden-import slowapi `
            --hidden-import limits `
            --collect-all openpyxl `
            run.py

      # ── macOS ──────────────────────────────────────────────────────────────

      - name: Build standalone executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller \
            --onefile \
            --name pmas-macos-arm64 \
            --add-data "frontend:frontend" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import fastapi \
            --hidden-import sqlalchemy.dialects.sqlite \
            --hidden-import multipart \
            --hidden-import anyio \
            --hidden-import h11 \
            --hidden-import slowapi \
            --hidden-import limits \
            --collect-all openpyxl \
            run.py

      # ── Upload ─────────────────────────────────────────────────────────────

      - name: Upload executable to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "" 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.artifact_path }}" --clobber
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            gh release upload "${{ github.ref_name }}" dist/pmas-linux-x64-package.tar.gz --clobber
          fi
        shell: bash
